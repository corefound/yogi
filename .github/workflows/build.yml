name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            package_name: yogi-linux-x64
            archive_name: yogi-linux-x64.tar.gz
            archive_type: tar
            cmake_args: -DYOGI_ENABLE_LLVM=OFF -DYOGI_ALLOCATOR=system

          - os: macos-15
            label: macos-arm64
            package_name: yogi-macos-arm64
            archive_name: yogi-macos-arm64.tar.gz
            archive_type: tar
            cmake_args: -DYOGI_ENABLE_LLVM=OFF -DYOGI_ALLOCATOR=system

          - os: macos-15-intel
            label: macos-x64
            package_name: yogi-macos-x64
            archive_name: yogi-macos-x64.tar.gz
            archive_type: tar
            cmake_args: -DYOGI_ENABLE_LLVM=OFF -DYOGI_ALLOCATOR=system
            
          - os: windows-2022
            arch: x86_64
            label: win-x64
            package_name: yogi-windows-x64
            archive_name: yogi-windows-x64.zip
            archive_type: zip
            cmake_args: -DYOGI_ENABLE_LLVM=OFF -DYOGI_ALLOCATOR=system

    steps:
      - name: Enable long paths Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=OFF `
            -DYOGI_PORTABLE_BUILD=ON `
            ${{ matrix.cmake_args }}

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DBUILD_TESTING=OFF \
            -DYOGI_PORTABLE_BUILD=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: |
          cmake --build build --target yogi --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Create portable folder
        run: |
          cmake --install build --prefix dist/${{ matrix.package_name }} --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Compress Windows package
        if: matrix.archive_type == 'zip'
        shell: powershell
        run: |
          Compress-Archive -Path "dist/${{ matrix.package_name }}/*" -DestinationPath "dist/${{ matrix.archive_name }}" -Force

      - name: Compress Unix package
        if: matrix.archive_type == 'tar'
        run: |
          cd dist
          tar -czf "${{ matrix.archive_name }}" "${{ matrix.package_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.archive_name }}
          compression-level: 9

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show release assets
        run: |
          find release-assets -type f

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
